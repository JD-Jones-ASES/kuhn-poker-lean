sources:
  - title: "A simplified two-person poker"
    authors: ["H. W. Kuhn"]
    id: "doi:10.1515/9781400881727-010"
    type: "paper"
    location: "In: H. W. Kuhn, A. W. Tucker (eds.), Contributions to the Theory of Games, Volume I, Annals of Mathematics Studies 24, Princeton University Press (1950), 97-103 (Crossref dates the DOI 1951-12-31 and gives pp. 97-104, the scan's eighth page being blank; the catalogues and zbMATH give 1950, 97-103); the whole paper read: p. 97 (the rules), p. 98 (the five courses of play and the coding of pure strategies), p. 99 (the essential 8 x 4 matrix), p. 100 (the twelve and two basic optimal strategies, the value -1/18), p. 101 (the behaviour parameters and the one-parameter family), pp. 102-103 (the general ante a and bet b, Cases 1-4, stated without proof)"
    relationship: "formalizes"
    author_endorsement: "not-contacted"
    note: >-
      The source of the game and of every classical statement: the rules and payoffs (p. 97-98), the essential matrix (p. 99), the
      basic optimal strategies and the value (p. 100), the behaviour-parameter family (p. 101), II's single
      solution (p. 102), and the general-stakes solutions with their values (pp. 102-103). The proofs here are
      not Kuhn's: his completeness argument goes through the superfluousness of dominated strategies and the
      kernel theory of discrete games (the papers of this study he cites), whereas every inequality here is a
      finite nonnegative-product identity and every "only if" a linear certificate from finitely many pure
      strategies, with the coordinates Kuhn removes as superfluous (three of I's, four of II's) proved forced
      rather than cited (I's call with the 3 except where 3 alpha = 1 leaves it unreached). Two corrections to
      the printed text and one scope note: the Case 3 interval for eta (case_three_II_iff,
      case_three_printed_interval, case_three_printed_upper_end_fails); p. 101's beta = 5/12 for (I) and (J),
      where 7/12 is meant (noted in the documentation, not a theorem); and the scope of "both players have a
      unique optimal mode of behavior" in Case 1, true in his behaviour parameters, while in the full game II
      may also bet the 2 after a pass with any probability in [0, 2(a - b)/(2a + b)] (case_one_II_iff).
  - title: "The Mathematics of Poker"
    authors: ["Bill Chen", "Jerrod Ankenman"]
    id: "isbn:9781886070257"
    type: "book"
    location: "ConJelCo, Pittsburgh (2006), x + 382 pp.; not read"
    relationship: "background"
    author_endorsement: "not-contacted"
    note: "Named for context as a later poker-theory exposition that treats three-card games with a pot parameter; not read, nothing is taken from it, and no statement of this entry is attributed to it."
  - title: "Basic solutions of discrete games"
    authors: ["L. S. Shapley", "R. N. Snow"]
    id: "doi:10.1515/9781400881727-004"
    type: "paper"
    location: "In: H. W. Kuhn, A. W. Tucker (eds.), Contributions to the Theory of Games, Volume I, Annals of Mathematics Studies 24, Princeton University Press (1950), 27-35; not read"
    relationship: "background"
    author_endorsement: "not-contacted"
    note: >-
      The kernel theory Kuhn's completeness proof invokes on pp. 100-101 ("all optimal strategies are convex
      linear combinations of the strategies given above"). Nothing from it is formalized or relied on: the
      optimal sets are characterized here by linear certificates, and Kuhn's convex-hull statement is replayed
      by scripts/check_kuhn.py (an exact enumeration finds exactly his twelve and two vertices) but is not
      stated as a Lean theorem, whose "exactly" clause is the realization-plan form.
  - title: "Solutions of finite two-person games"
    authors: ["D. Gale", "S. Sherman"]
