related_formalizations:
  - id: "PALOMAR-2026-10-01-000004"
    relationship: "other"
    note: >-
      minimax-theorem-lean (Arthur742Ramos, registered 2026-10-01): for every finite two-player zero-sum game,
      the sup-inf and inf-sup of the expected payoff over mixed strategies agree (von Neumann's minimax theorem;
      its three definitions are comparator holes, which the repository defines so, proving a saddle point
      through Mathlib's Sion theorem). Its theorem implies that Kuhn poker's 27 x 64 normal form has a value; it
      does not compute it. This entry exhibits the value and both optimal sets directly, by certificates, in
      behaviour and in mixed strategies, and shares no code with it.
  - id: "PALOMAR-2026-09-08-000002"
    relationship: "other"
    note: >-
      Verified regret matching and finite-time equilibrium computation (Arthur742Ramos, registered
      2026-09-08): regret bounds and approximate equilibria of finite zero-sum matrix games by self-play; its
      repository metadata states that no extensive-form or poker performance theorem is claimed. Kuhn poker is
      a standard test game in that literature; no equilibrium of it is stated there. No code is shared.
  - id: "https://github.com/elazarg/GameTheory/tree/e33b1317302b3413b2d690862eabbbe067a7d499"
    relationship: "other"
    note: >-
      A Lean 4 game-theory library (extensive-form games, behaviour strategies and perfect recall after Kuhn 1953,
      counterfactual-regret modules; main at e33b131, 2026-10-09, read by tree path and content search, and
      re-read 2026-10-10 with no poker path on main or on the branch pushed that day). It holds no poker instance
      and no value of Kuhn poker. No code is shared; this entry builds
      its game from the tree without a library.

status:
  scope: >-
    Thirty-seven compared theorems over thirty-one compared definitions, all built from Kuhn's game tree. For
    Kuhn's game (a = b = 1): the value -1/18 in both guarantee and equilibrium form, uniqueness of the value,
    the two certificate identities, the explicit equilibrium set, II's unique optimal strategy, I's optimal set
    as Kuhn's family with the unreached-information-set clause, Kuhn's essential matrix, his twelve and two
    basic optimal mixed strategies, the value of the normal form, and the exact optimal sets of the normal form
    in realization-plan and marginal form. For every ante and bet: the value function and guaranteeing
    strategies (a, b > 0) in the three regions b <= a, a <= b <= 2a, b >= 2a, with the corrected Case 3 interval for eta,
    and both players' optimal sets in every region, the diagonal and the line b = 2a included (on that line
    II's set is a five-dimensional polytope cut out, within the valid strategies, by one equation and four
    inequalities, the six-product
    identity behind it a theorem); every equilibrium pays the value and a pair is an equilibrium iff each
    strategy guarantees it, at every ante and bet, the equilibria on b = 2a explicit. Not claimed as compared
    theorems: the nine vertices and the dimension of II's set on b = 2a (replayed by
    scripts/check_boundary.py); Kuhn's convex-hull form of the optimal polytopes
    (its vertices replayed by scripts/check_kuhn.py, not stated; equivalent on paper to the realization-plan
    form stated); anything about more than three cards.
    The intentional placeholders of Challenge.lean are excluded from proof counts; Solution.lean does not
    import Challenge.lean.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
