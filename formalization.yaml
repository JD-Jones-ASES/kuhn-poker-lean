# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Kuhn poker: the value is -1/18, player II's optimal strategy is unique, player I's optimal strategies are Kuhn's one-parameter family, the twelve and two basic optimal mixed strategies and the optimal sets of the normal form, and the value at every ante and bet with Kuhn's Case 3 interval corrected"
  description: >-
    A Lean 4 development of Kuhn's simplified two-person poker (Kuhn 1950): three cards 1 < 2 < 3, one dealt
    to each player with the six deals equiprobable, an ante of a from each player and a single bet of b, player I
    acting first, the five courses of play of Kuhn's p. 98 with payoffs a (pass-pass, to the higher card), a to
    II (pass-bet-pass), a + b to the higher card (pass-bet-bet), a to I (bet-pass) and a + b to the higher card
    (bet-bet). The definitions are built from the game tree: a behaviour strategy of I is a pair of functions
    on the three cards (the probability of betting first, the probability of calling after passing and facing
    a bet), one of II likewise (the probability of betting after a pass, the probability of calling a bet); the
    payoff is the average over the six deals; a strategy guarantees v when it is valid and earns at least v
    (holds the opponent to at most v) against every valid strategy of the opponent; the game has value v when
    each player has a strategy guaranteeing v; an equilibrium is a saddle point. For Kuhn's game a = b = 1,
    kernel-checked: the value is -1/18 (a game has at most one value), an equilibrium exists, every equilibrium
    pays I exactly -1/18, and a pair is an equilibrium iff each strategy guarantees -1/18; II's optimal
    strategy is unique at all six information sets (bet after a pass with the 1, 2, 3 with probabilities
    1/3, 0, 1; call with probabilities 0, 1/3, 1 - Kuhn's (xi, eta) = (1/3, 1/3) with the four coordinates he
    removed as superfluous now proved forced); I's optimal strategies are exactly Kuhn's one-parameter family
    (bet the 1 with probability alpha and fold it, never bet the 2 first and call with it with probability
    alpha + 1/3, bet the 3 with probability 3 alpha and call with it, for alpha in [0, 1/3], the call with
    the 3 being unconstrained exactly when 3 alpha = 1, where that information set is unreached); in the
    normal form with Kuhn's coding of the 27 and 64 pure strategies, his essential 8 x 4 matrix is six times
    the game matrix, his twelve basic optimal mixed strategies (A)-(L) and II's two guarantee -1/18, and a
    mixed strategy is optimal iff its realization plan lies on the family (I) or its marginals are II's
    strategy (II). For every ante a > 0 and bet b > 0 (Kuhn's pp. 102-103, stated there without proof, and
    the region b > 2a he does not state): the value is -b^2/(6(2a + b)) for b <= a, -b(2a - b)/(6(2a + b))
    for a <= b <= 2a and 0 for b >= 2a, with explicit guaranteeing strategies in each case; in Case 3 the
    calling probability eta with the 2 ranges over [(2a - b)/(2a + b), b/(2a + b)], and the interval printed
    on p. 102, b/(2a + b) <= eta <= (a + b)/(2a + b), fails at its upper end (at a = 2, b = 3 and eta = 5/7
    some pure strategy of I earns more than the value). Every inequality is a finite nonnegative-product
    identity (the target minus the payoff is a sum of nonnegative rational multiples of products of
    probabilities and their complements, or of such products with the case factors a - b, 2a - b, b - 2a), and
    every "only if" is a linear certificate from finitely many pure strategies; no library holds the game.
    Beyond Kuhn's statements: the two certificate identities are stated as theorems; the equilibria of Kuhn's
    game are exactly the pairs (kuhnI α k, kuhnII); and at general stakes the optimal sets are determined -
    I's strategy is unique off the diagonal b = a (for b < a up to the unreached call with the 3; for
    a < b <= 2a outright; for b >= 2a a polytope of one inequality), so Kuhn's one-parameter family exists
    only at b = a; II's strategy is unique on the diagonal at every scale, a segment for b <= a (the bet with
    the 2 after a pass free in [0, 2(a - b)/(2a + b)], so Kuhn's 'unique optimal mode of behavior' in Case 1
    holds for his reduced parameters only), a polytope of three inequalities for a <= b < 2a, and a polytope
    of one inequality for b > 2a; the corrected Case 3 interval is sharp, and the printed one holds only at its
    lower end. A third misprint is recorded in the documentation: p. 101's table gives β = 5/12 for (I) and
    (J), where p. 100's mixtures and p. 101's own formula give 7/12.
  authors: ["JD Jones"]
  responsible_maintainers: ["JD Jones"]
  license: "MIT"

classification:
  arxiv: ["cs.GT"]
  msc2020: ["91A05", "91A18", "91A60"]

sources:
  - title: "A simplified two-person poker"
    authors: ["H. W. Kuhn"]
    id: "doi:10.1515/9781400881727-010"
    type: "paper"
    location: "In: H. W. Kuhn, A. W. Tucker (eds.), Contributions to the Theory of Games, Volume I, Annals of Mathematics Studies 24, Princeton University Press (1950), 97-103; the whole paper read: p. 97 (the rules), p. 98 (the five courses of play and the coding of pure strategies), p. 99 (the essential 8 x 4 matrix), p. 100 (the twelve and two basic optimal strategies, the value -1/18), p. 101 (the behaviour parameters and the one-parameter family), pp. 102-103 (the general ante a and bet b, Cases 1-4, stated without proof)"
    relationship: "formalizes"
    author_endorsement: "not-contacted"
    note: >-
      The source of every statement: the rules and payoffs (p. 97-98), the essential matrix (p. 99), the
      basic optimal strategies and the value (p. 100), the behaviour-parameter family (p. 101), II's single
      solution (p. 102), and the general-stakes solutions with their values (pp. 102-103). The proofs here are
      not Kuhn's: his completeness argument goes through the superfluousness of dominated strategies and the
      kernel theory of discrete games (the papers of this study he cites), whereas every inequality here is a
      finite nonnegative-product identity and every "only if" a linear certificate from finitely many pure
      strategies, with the four coordinates per player that Kuhn removes as superfluous proved forced rather
      than cited. Two corrections to the printed text are stated and proved: the Case 3 interval for eta (see
      the description), and the scope of "both players have a unique optimal mode of behavior" in Case 1,
      which holds for the reduced parameters only (II may bet the 2 after a pass with any probability in
      [0, 2(a - b)/(2a + b)]; this is stated in the documentation, not as a compared theorem).
  - title: "Basic solutions of discrete games"
    authors: ["L. S. Shapley", "R. N. Snow"]
    id: "doi:10.1515/9781400881727-004"
    type: "paper"
    location: "In: H. W. Kuhn, A. W. Tucker (eds.), Contributions to the Theory of Games, Volume I, Annals of Mathematics Studies 24, Princeton University Press (1950), 27-35; not read"
    relationship: "background"
    author_endorsement: "not-contacted"
    note: >-
      The kernel theory Kuhn's completeness proof invokes on pp. 100-101 ("all optimal strategies are convex
      linear combinations of the strategies given above"). Nothing from it is formalized or relied on: the
      optimal sets are characterized here by linear certificates, and Kuhn's convex-hull statement is replayed
      in the standard-library checker (the optimal polytopes have exactly his twelve and two vertices) but not
      stated as a Lean theorem, whose "exactly" clause is the realization-plan form.
  - title: "The Lean 4 Theorem Prover and Programming Language"
    authors: ["Leonardo de Moura", "Sebastian Ullrich"]
    id: "doi:10.1007/978-3-030-79876-5_37"
    type: "paper"
    location: "Automated Deduction - CADE 28, Lecture Notes in Computer Science, Springer, 2021, 625-635"
    relationship: "background"
    author_endorsement: "n/a"
    note: "The proof assistant (leanprover/lean4:v4.35.0-rc2). Nothing mathematical is taken from it."
  - title: "The Lean mathematical library"
    authors: ["The mathlib Community"]
    id: "doi:10.1145/3372885.3373824"
    type: "paper"
    location: "Proceedings of the 9th ACM SIGPLAN International Conference on Certified Programs and Proofs (CPP 2020), 367-381"
    relationship: "background"
    author_endorsement: "n/a"
    note: "The library the development imports (tag v4.35.0-rc2): real arithmetic, Fin, finite sums, matrices and the tactics linarith, nlinarith, linear_combination, positivity and norm_num."

related_formalizations:
  - id: "PALOMAR-2026-10-01-000004"
    relationship: "other"
    note: >-
      minimax-theorem-lean (Arthur742Ramos, registered 2026-10-01): von Neumann's minimax theorem for every
      finite two-player zero-sum game, through Mathlib's Sion theorem. It proves that Kuhn poker's 27 x 64
      normal form has a value; it does not compute it. This entry exhibits the value and both optimal sets
      directly, by certificates, in behaviour and in mixed strategies, and shares no code with it.
  - id: "PALOMAR-2026-09-08-000002"
    relationship: "other"
    note: >-
      Verified regret matching and finite-time equilibrium computation (Arthur742Ramos, registered
      2026-09-08): regret bounds and approximate equilibria of finite zero-sum matrix games by self-play; its
      metadata excludes extensive-form CFR+ and any poker theorem. Kuhn poker is the canonical test game of
      that line; no exact equilibrium of it is stated there. No code is shared.
  - id: "https://github.com/elazarg/GameTheory"
    relationship: "other"
    note: >-
      A Lean 4 game-theory library (extensive-form games, behaviour strategies, Kuhn's theorem on perfect
      recall, counterfactual-regret modules; HEAD e33b131 on 2026-10-09, read by tree path and content
      search). It holds no poker instance and no value of Kuhn poker. No code is shared; this entry builds
      its game from the tree without a library.

status:
  scope: >-
    Thirty-one compared theorems over thirty-one compared definitions, all built from Kuhn's game tree. For
    Kuhn's game (a = b = 1): the value -1/18 in both guarantee and equilibrium form, uniqueness of the value,
    II's unique optimal strategy, I's optimal set as Kuhn's family with the unreached-information-set clause,
    Kuhn's essential matrix, his twelve and two basic optimal mixed strategies, the value of the normal form,
    and the exact optimal sets of the normal form in realization-plan and marginal form. For every ante and
    bet: the value function and guaranteeing strategies in the three regions b <= a, a <= b <= 2a, b >= 2a,
    with the corrected Case 3 interval for eta; the two certificate identities; the explicit equilibrium set;
    and the optimal sets at general stakes (I's in every region, II's off the line b = 2a). Not claimed as
    compared theorems: II's optimal set on the line b = 2a; Kuhn's convex-hull form of the optimal polytopes
    (replayed in the checker: exactly his twelve and two vertices; equivalent on paper to the realization-plan
    form stated); anything about more than three cards.
    The intentional placeholders of Challenge.lean are excluded from proof counts; Solution.lean does not
    import Challenge.lean.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
