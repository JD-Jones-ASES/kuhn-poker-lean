      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"

automation:
  methods:
    - method: "agent"
      models: ["Claude Opus 5.5 (Anthropic)", "Claude Fable 5.1 (Anthropic)"]
      framework: "Claude Code with parallel subagents"
      tool_setup: >-
        The project was directed by its author. Claude (Anthropic) in Claude Code was used throughout: the
        reading of Kuhn's paper, the statements and their check against it, the exact certificates, the Lean
        proofs, the standard-library replay, the prior-art searches and the repository text; Claude Fable 5.1
        pinned the statements, wrote the replay checker, merged the proof files and wrote the documents, and
        Claude Opus 5.5 subagents computed and verified the certificates (exact rational arithmetic, with
        linear-programming duals as finders), wrote the Lean proofs and audited them. Lean v4.35.0-rc2 and
        Mathlib v4.35.0-rc2 (commit 065356127b1dc0016f66b7283ce0ce2c4055aa55) are pinned by the committed
        manifest and lake update is never run; there are no GitHub Actions workflows. There is no native_decide
        and no decide +kernel: the proofs unfold the payoff to a polynomial over the reals in the twelve
        probabilities (and a, b), close each inequality by linarith with the certificate's nonnegative products
        supplied as mul_nonneg hints (the identities by ring, one by linear_combination; no nlinarith), each
        "only if" by linarith from finitely many pure strategies, and the normal-form statements by an affine
        bridge from mixed strategies to realization plans and marginals.
    - method: "agent"
      models: ["GPT-6 (OpenAI)"]
      framework: "ChatGPT"
      tool_setup: >-
        A pre-submission review of the tree at a46246e (2026-10-10). Its proposals, the five statements on the
        line b = 2a and the all-stakes equilibria with their proofs and the source guard's regex fix, were
        checked here with the full verification gate before adoption; the documentation is this repository's.
  spend_usd: "not tracked"

fidelity:
  divergences: >-
    Cards are 0 < 1 < 2 for Kuhn's 1, 2, 3; a behaviour strategy is a pair of functions Fin 3 -> ℝ (the Challenge
    defines Strategy₁ and Strategy₂ as that product type), with validity the condition that every coordinate
    lies in [0, 1]; the payoff is the sum over the six deals of distinct cards divided by six, with the five
    courses as a polynomial in the probabilities. Kuhn's behaviour parameters (alpha, beta, gamma; xi, eta) on
    p. 101 live in the reduced game after dominated strategies are removed; here the strategies carry all
    twelve coordinates, and the removed ones are proved to take their forced values in every optimal
    strategy of Kuhn's game (I: fold the 1 to a bet, never bet the 2 first, call with the 3 unless 3 alpha = 1; II: never
    bet the 2 after a pass, always bet the 3 after a pass, never call with the 1, always call with the 3); on the
    diagonal b = a the same holds at every scale, and off it some are not forced, as the optimal-set theorems
    state: I's call with the 3 for b < a (where the 3 is always bet) and for b > 2a; II's bet with the 2 after a
    pass for b < a, its call with the 1 for a < b <= 2a, its bet with the 3 after a pass for b >= 2a, and its call
    with the 3 for b > a. The family is indexed by alpha = gamma/3 in [0, 1/3] rather than Kuhn's gamma in [0, 1].
    The clause "3 alpha = 1 or k = 1" in guarantees₁_iff is the unreached-information-set convention made
    explicit: Kuhn's
    family says nothing about the call with the 3 when it always bets. Optimality is defined as guaranteeing
    the value against every valid strategy of the opponent (the maximin/minimax form), and shown equivalent to
    being part of an equilibrium. The normal-form statements use Kuhn's coding of pure strategies verbatim
    (x_c in {0, 1, 2}; y_c in {0, 1, 2, 3} in binary) and state the optimal sets by realization plans and
    marginals, not as convex hulls of his vertices. The general-stakes theorems state the value function
    kuhnValue a b with three regions and closed boundaries (Kuhn's Case 2, b = a, is the common boundary of
    his Cases 1 and 3; his Case 4 is the single stake b = 2a, extended here to all b >= 2a); the Case 3
    witness for II carries the corrected interval for eta, [(2a - b)/(2a + b), b/(2a + b)], in place of the
    printed b/(2a + b) <= eta <= (a + b)/(2a + b), which the standard-library checker refutes at a = 2, b = 3.

review:
  status: "self-assessed"
  notes: >-
    No independent human expert review and no source-author endorsement is claimed; AI agents computed the
    certificates, wrote the proofs and audited them in separate passes, the statements were checked against
    Kuhn's paper page by page, and VERIFICATION.md states what is checked and what is not. Mechanical
    correctness and agreement of formal statements do not establish priority or significance. Kuhn's 1950
    paper states the value and the optimal strategies for a = b = 1 and, without proof, the general-stakes
    solutions; the full-game optimal sets at general stakes, the region b > 2a and the corrections are not in it.
    His p. 103 remark at b = 2a, 'The strategy for I is unique while II can vary his strategy considerably', names the freedom that boundary_II_iff makes exact. No
    earlier kernel check of these results was found by the dated search (Palomar's feed and day index, Hexagon,
    formal-conjectures, openai/math, the Lean game theory libraries, the arXiv API, GitHub code search in Lean,
    Isabelle, Coq and Agda, 2026-10-09 and 2026-10-10); no first is claimed beyond it.

alignment:
  namespace: "KuhnPoker"
  statements:
    - source: "Kuhn 1950, p. 100 (the value -1/18)"
      lean: "KuhnPoker.hasValue_one_one"
      module: "Solution"
      status: "proved"
      note: "Kuhn's game has value -1/18: each player has a strategy guaranteeing it."
    - source: "Standard (a zero-sum game has at most one value)"
      lean: "KuhnPoker.hasValue_unique"
      module: "Solution"
      status: "proved"
      note: "If each player can guarantee v and each can guarantee w, then v = w, at every ante and bet."
    - source: "Kuhn 1950, p. 100 (the optimal strategies and the value -1/18)"
      lean: "KuhnPoker.exists_isEquilibrium"
      module: "Solution"
      status: "proved"
      note: "An equilibrium exists."
    - source: "Kuhn 1950, p. 100"
      lean: "KuhnPoker.payoff_of_isEquilibrium"
      module: "Solution"
      status: "proved"
      note: "Every equilibrium pays I exactly -1/18."
    - source: "Standard (exchangeability of optimal strategies in zero-sum games)"
      lean: "KuhnPoker.isEquilibrium_iff"
      module: "Solution"
      status: "proved"
      note: "A pair is an equilibrium iff each strategy guarantees -1/18."
    - source: "Kuhn 1950, p. 102 ((xi, eta) = (1/3, 1/3)) and pp. 98-100 (the superfluous strategies)"
      lean: "KuhnPoker.guarantees₂_iff"
      module: "Solution"
      status: "proved"
      note: "II's optimal strategy is unique: bet after a pass with probabilities 1/3, 0, 1 and call with 0, 1/3, 1, the four forced coordinates proved."
    - source: "Kuhn 1950, p. 101 (alpha = gamma/3, beta = gamma/3 + 1/3, 0 <= gamma <= 1) and pp. 98-100"
      lean: "KuhnPoker.guarantees₁_iff"
      module: "Solution"
      status: "proved"
      note: "I's optimal strategies are exactly kuhnI alpha k with alpha in [0, 1/3], k in [0, 1] and (3 alpha = 1 or k = 1)."
    - source: "Kuhn 1950, p. 99 (the essential matrix, six times the game matrix) with the coding of p. 98"
      lean: "KuhnPoker.essentialMatrix_eq"
      module: "Solution"
      status: "proved"
      note: "The thirty-two entries, row by row."
    - source: "Kuhn 1950, p. 100, (A)-(L)"
      lean: "KuhnPoker.basic₁_guarantees"
      module: "Solution"
      status: "proved"
      note: "Each of the twelve basic optimal mixed strategies guarantees -1/18 in the normal form."
    - source: "Kuhn 1950, p. 100, the two strategies for II"
      lean: "KuhnPoker.basic₂_guarantees"
      module: "Solution"
      status: "proved"
      note: "Each of II's two basic optimal mixed strategies guarantees -1/18 in the normal form."
    - source: "Kuhn 1950, p. 100"
      lean: "KuhnPoker.hasMixedValue"
      module: "Solution"
      status: "proved"
      note: "The 27 x 64 normal form has value -1/18."
    - source: "Kuhn 1950, pp. 100-101 (all optimal strategies are convex combinations of (A)-(L)), in realization-plan form"
      lean: "KuhnPoker.guaranteesMixed₁_iff"
      module: "Solution"
      status: "proved"
      note: "A mixed strategy of I is optimal iff it is a probability vector whose realization plan is (alpha, 0, 3 alpha; 0, alpha + 1/3, 1 - 3 alpha) for some alpha in [0, 1/3]."
    - source: "Kuhn 1950, pp. 100-101 (II's two basic strategies), in marginal form"
      lean: "KuhnPoker.guaranteesMixed₂_iff"
      module: "Solution"
      status: "proved"
      note: "A mixed strategy of II is optimal iff it is a probability vector with marginals (1/3, 0, 1; 0, 1/3, 1)."
    - source: "Kuhn 1950, pp. 102-103, Cases 1-4 (the values), extended to b > 2a"
      lean: "KuhnPoker.hasValue_general"
      module: "Solution"
      status: "proved"
      note: "For a, b > 0 the game has value kuhnValue a b: -b^2/(6(2a + b)) for b <= a, -b(2a - b)/(6(2a + b)) for a <= b <= 2a, 0 for b >= 2a."
    - source: "Kuhn 1950, p. 102, Case 2"
      lean: "KuhnPoker.kuhnValue_one_one"
      module: "Solution"
      status: "proved"
      note: "kuhnValue 1 1 = -1/18."
    - source: "Kuhn 1950, p. 102, Case 1"
      lean: "KuhnPoker.guarantees_case_one"
      module: "Solution"
      status: "proved"
      note: "For a, b > 0 and b <= a, Kuhn's Case 1 strategies guarantee kuhnValue a b: I's (b/(2a+b), 0, 1; 0, 2a/(2a+b), 1) and II's (b/(2a+b), 0, 1; 0, (2a-b)/(2a+b), 1)."
    - source: "Kuhn 1950, p. 102, Case 3, the interval for eta corrected"
      lean: "KuhnPoker.guarantees_case_three"
      module: "Solution"
      status: "proved"
      note: "For a, b > 0 and a <= b <= 2a, Kuhn's Case 3 strategies guarantee kuhnValue a b: I's (0, 0, 0; 0, (2a-b)/(2a+b), 1) and II's (b/(2a+b), 0, 1; 0, eta, 1) for every eta in the corrected interval [(2a - b)/(2a + b), b/(2a + b)]."
    - source: "Kuhn 1950, p. 103, Case 4 (b = 2a), and the region b > 2a"
      lean: "KuhnPoker.guarantees_case_four"
      module: "Solution"
      status: "proved"
      note: "For a, b > 0 and b >= 2a, I's strategy (0, 0, 0; 0, 0, 1) and II's (0, 0, 1; 0, 0, 1) both guarantee 0: I never bets first and calls only with the 3; II bets after a pass only with the 3 and calls only with the 3."
    - source: "This development (the certificate behind Kuhn's p. 100 value, upper side)"
      lean: "KuhnPoker.upper_certificate"
      module: "Solution"
      status: "proved"
      note: "For every strategy σ of I, -1/18 - payoff σ kuhnII = (1 - σ.1 0)σ.2 0/6 + σ.1 1/18 + (1 - σ.1 2)(1 - σ.2 2)/6."
    - source: "This development (the certificate behind Kuhn's p. 101 family, lower side)"
      lean: "KuhnPoker.lower_certificate"
      module: "Solution"
      status: "proved"
      note: "For every α, k and every strategy τ of II, payoff (kuhnI α k) τ + 1/18 = α/2 τ.2 0 + α/2 (1 - τ.2 2) + (1/3 - α)/2 τ.1 1 + (1/18 + α/6)(1 - τ.1 2) - (1 - 3α)(1 - k)(τ.1 0 + τ.1 1)/2."
    - source: "Kuhn 1950, pp. 100-102 (the optimal strategies of both players), as the set of equilibria"
      lean: "KuhnPoker.isEquilibrium_iff_explicit"
      module: "Solution"
      status: "proved"
      note: "IsEquilibrium 1 1 σ τ iff σ = kuhnI α k for some α in [0, 1/3], k in [0, 1] with 3α = 1 or k = 1, and τ = kuhnII."
    - source: "This development (Kuhn 1950, p. 102, Case 1, states one strategy)"
      lean: "KuhnPoker.case_one_I_unique"
      module: "Solution"
      status: "proved"
      note: "For a, b > 0 and b < a, I's strategy guarantees the value iff it is (b/(2a+b), 0, 1; 0, 2a/(2a+b), k) for some k in [0, 1]."
    - source: "This development (Kuhn 1950, p. 102, Case 1: 'both players have a unique optimal mode of behavior' holds for the reduced parameters only)"
      lean: "KuhnPoker.case_one_II_iff"
      module: "Solution"
      status: "proved"
      note: "For a, b > 0 and b <= a, II's strategy guarantees the value iff it is (b/(2a+b), ξ, 1; 0, (2a-b)/(2a+b), 1) for some ξ in [0, 2(a-b)/(2a+b)]."
    - source: "Kuhn 1950, p. 102 (Case 2 at every scale)"
      lean: "KuhnPoker.diagonal_II_unique"
      module: "Solution"
      status: "proved"
      note: "For a > 0, II's strategy guarantees kuhnValue a a iff it is (1/3, 0, 1; 0, 1/3, 1)."
    - source: "Kuhn 1950, p. 101 (the family), at every scale by homogeneity"
      lean: "KuhnPoker.diagonal_I_iff"
      module: "Solution"
      status: "proved"
      note: "For a > 0, I's strategy guarantees kuhnValue a a iff it is kuhnI alpha k with alpha in [0, 1/3], k in [0, 1] and (3 alpha = 1 or k = 1)."
    - source: "This development (Kuhn 1950, p. 102, Case 3, states one strategy)"
      lean: "KuhnPoker.case_three_I_unique"
      module: "Solution"
      status: "proved"
      note: "For a < b <= 2a, I's strategy guarantees the value iff it is (0, 0, 0; 0, (2a-b)/(2a+b), 1)."
    - source: "Kuhn 1950, p. 102, Case 3, the interval for η corrected and shown sharp"
      lean: "KuhnPoker.case_three_II_iff"
      module: "Solution"
      status: "proved"
      note: "For a, b > 0 and a <= b <= 2a, with the other coordinates as pinned, (b/(2a+b), 0, 1; 0, η, 1) guarantees the value iff (2a-b)/(2a+b) <= η <= b/(2a+b)."
    - source: "This development (Kuhn 1950, p. 102, Case 3, states the η family only)"
      lean: "KuhnPoker.case_three_II_set"
      module: "Solution"
      status: "proved"
      note: "For a <= b < 2a, II's strategy guarantees the value iff it is valid, its bets after a pass are (b/(2a+b), 0, 1), and its calls satisfy the three stated inequalities."
    - source: "Kuhn 1950, p. 102, Case 3, the printed interval b/(2a+b) <= η <= (a+b)/(2a+b)"
      lean: "KuhnPoker.case_three_printed_interval"
      module: "Solution"
      status: "proved"
      note: "For a, b > 0 and a <= b <= 2a, with η on the printed interval b/(2a+b) <= η <= (a+b)/(2a+b), II's strategy (b/(2a+b), 0, 1; 0, η, 1) guarantees the value iff η = b/(2a+b)."
    - source: "Kuhn 1950, p. 102, Case 3, the printed upper end"
      lean: "KuhnPoker.case_three_printed_upper_end_fails"
      module: "Solution"
      status: "proved"
      note: "At a = 2, b = 3, η = 5/7 does not guarantee the value."
    - source: "This development (Kuhn 1950, p. 103, Case 4, states one strategy at b = 2a)"
      lean: "KuhnPoker.case_four_I_iff"
      module: "Solution"
      status: "proved"
      note: "For a, b > 0 and 2a <= b, I's strategy guarantees 0 iff it is valid, never bets the 1 or the 2 first, folds them, and 4a <= 2a σ.1 2 + (2a+b)(1 - σ.1 2) σ.2 2; at b = 2a this forces σ.1 2 = 0, and for b > 2a the 3 may be bet first with probability at most 1 - 2a/b."
    - source: "This development (the region b > 2a, which Kuhn does not state; his p. 103 remark on II's freedom at b = 2a is boundary_II_iff)"
      lean: "KuhnPoker.case_four_II_iff"
      module: "Solution"
      status: "proved"
      note: "For a, b > 0 and 2a < b, II's strategy guarantees 0 iff it is valid, never bets the 1 or 2 after a pass, never calls with them, and 4a <= (2a+b) τ.2 2."
    - source: "This development (the identity behind II's set on b = 2a)"
      lean: "KuhnPoker.boundary_II_certificate"
      module: "Solution"
      status: "proved"
      note: "For every a and every pair of strategies with II's bet with the 2 after a pass zero, -3 payoff a (2a) σ τ = a times six products: 2 σ.1 0 (τ.2 1 + τ.2 2 - 1), (1 - σ.1 0) σ.2 0 τ.1 2, σ.1 1 (2 τ.2 2 - 1 - τ.1 0 - τ.2 0), (1 - σ.1 1) σ.2 1 (τ.1 2 - 2 τ.1 0), σ.1 2 (τ.1 0 - τ.2 0 - τ.2 1), 2 (1 - σ.1 2)(1 - σ.2 2) τ.1 0."
    - source: "This development (Kuhn 1950, p. 103, Case 4, states one strategy for II at b = 2a and remarks on its freedom)"
      lean: "KuhnPoker.boundary_II_iff"
      module: "Solution"
      status: "proved"
      note: "For a > 0, II's strategy guarantees 0 at b = 2a iff it is valid, never bets the 2 after a pass, and 2 τ.1 0 <= τ.1 2, τ.2 0 + τ.2 1 <= τ.1 0, 1 <= τ.2 1 + τ.2 2, 1 + τ.1 0 + τ.2 0 <= 2 τ.2 2 (a five-dimensional polytope with nine vertices, replayed)."
    - source: "Standard (the payoff of an equilibrium is the value), at every ante and bet"
      lean: "KuhnPoker.payoff_of_isEquilibrium_general"
      module: "Solution"
      status: "proved"
      note: "For a, b > 0, every equilibrium pays I exactly kuhnValue a b (a sandwich between the two guaranteeing strategies of hasValue_general)."
    - source: "Standard (exchangeability of optimal strategies in zero-sum games), at every ante and bet"
      lean: "KuhnPoker.isEquilibrium_general_iff"
      module: "Solution"
      status: "proved"
      note: "For a, b > 0, a pair is an equilibrium iff each strategy guarantees kuhnValue a b; with the optimal sets this makes the equilibria explicit in every region."
    - source: "This development (Kuhn 1950, p. 103, Case 4: I's strategy at b = 2a and II's freedom)"
      lean: "KuhnPoker.boundary_isEquilibrium_iff"
      module: "Solution"
      status: "proved"
      note: "For a > 0, (σ, τ) is an equilibrium at b = 2a iff σ = (0, 0, 0; 0, 0, 1) and τ lies in the polytope of boundary_II_iff."
